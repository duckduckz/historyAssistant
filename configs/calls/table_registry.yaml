tables:
  historyCalls:
    source_id: calls
    es_index: televic.history.call
    description: call event history
    data_path: data/historyCalls/03_processed/fact_history_calls_v3.csv

    primary_key: call_id
    grain: one row per call event

    date_field: call_date
    timestamp_field: timestamp_utc
    end_timestamp_field: cancel_timestamp_utc

    identifiers:
      - call_id
      - ward_id

    dimensions:
      - ward_name
      - room_name
      - zone_name
      - area_name
      - shift
      - call_type
      - priority
      - person_type
      - person_name
      - person_location
      - cancel_location
      - is_cancelled
      - call_dayofweek
      - call_date
      - call_month
      - call_hour

    semantic_fields:
      ward: ward_name
      room: room_name
      zone: zone_name
      area: area_name
      person: person_name
      person_type: person_type

    dimension_value_maps:
      ward_name:
        field_type: keyword
        load_values_from_es: true
        description: "Ward+zone combined field (e.g. '2V ZONE 2A'). Floor prefix encodes the floor: '1V'=floor 1, '2V'=floor 2, 'GV'=ground floor. For 'floor 2' questions use values starting with '2V'; for 'ground floor' use 'GV'. Zone suffix (1A, 1B, 2A, etc.) further subdivides the ward. SERVICEFLATS is a separate care unit on floors 1 and 2."
        absorbs_field: zone_name
        absorb_separator: " ZONE "
        already_merged_marker: "ZONE"
      room_name:
        field_type: keyword
        load_values_from_es: true
        description: "Specific room code (e.g. 'K 228', 'SANITAIR 005'). Loaded from ES."
      zone_name:
        field_type: keyword
        load_values_from_es: true
        description: "Zone code within a ward. Loaded from ES."
      area_name:
        field_type: keyword
        load_values_from_es: true
        description: "Area name. Loaded from ES."
      call_type:
        field_type: keyword
        load_values_from_es: true
        description: "Type of nurse call. Values are title-cased as stored in the data."
      person_type:
        field_type: keyword
        allowed_values: [Patient, unknown]
        description: "Type of person who triggered the call."
      shift:
        field_type: keyword
        allowed_values: [day, evening, night]
        description: "Shift label with a natural display order of day, evening, then night."
      priority:
        field_type: integer
        value_map:
          high: 5
          urgent: [4, 5]
          medium-high: 4
          medium: 3
          low: 1
          none: 0
        allowed_values: [0, 1, 3, 4, 5]
        description: "Priority is stored as an integer. Use the value_map to translate natural-language labels to numeric values."
      call_hour:
        field_type: integer
        description: "Hour of the call (0-23). Used for time-of-day filtering."
      call_month:
        field_type: keyword
        description: "Month of the call in YYYY-MM format (e.g. '2024-04'). Use for monthly trend grouping."
      call_dayofweek:
        field_type: integer
        description: "Day of the week (0=Monday, 6=Sunday). Groupable for per-day-of-week breakdowns."
        value_map:
          monday: 0
          tuesday: 1
          wednesday: 2
          thursday: 3
          friday: 4
          saturday: 5
          sunday: 6
        allowed_values: [0, 1, 2, 3, 4, 5, 6]
        display_value_map:
          0: "Monday"
          1: "Tuesday"
          2: "Wednesday"
          3: "Thursday"
          4: "Friday"
          5: "Saturday"
          6: "Sunday"


    event_fields:
      - call_name
      - cancel_person
      - cancellation_trigger
      - triggered_by

    metrics:
      - numeric_summary
      - total_calls
      - avg_response_time
      - avg_staying_time
      - median_response_time
      - median_staying_time
      - p75_response_time
      - p90_response_time
      - p90_staying_time
      - p95_staying_time
      - response_within_2_min_rate
      - response_within_3_min_rate
      - response_over_5_min_rate
      - response_over_5_min_count
      - avg_calls_per_shift
      - avg_calls_per_zone
      - dq_unknown_caller_rate
      - dq_missing_location_and_caller_count
      - dq_invalid_priority_or_time_count
      - dq_calls_without_clearer_count
      - dq_extreme_staying_time_rate
      - call_details

    measure_fields:
      - response_time_sec
      - staying_time_sec
      - staying_time_min

    measure_field_maps:
      response_time_sec:
        field_type: number
        allowed_aggregations: [avg, min, max, sum, median, percentile]
        unit: seconds
        description: Time from call trigger to response, in seconds.
      staying_time_sec:
        field_type: number
        allowed_aggregations: [avg, min, max, sum, median, percentile]
        unit: seconds
        description: Duration from response to cancellation or end, in seconds.
      staying_time_min:
        field_type: number
        allowed_aggregations: [avg, min, max, sum]
        unit: minutes
        description: Duration from response to cancellation or end, in minutes.

    dq_flags:
      - dq_unknown_location_flag
      - dq_missing_staying_time_when_cancelled
      - dq_missing_response_time
      - dq_extreme_response_time_flag
      - dq_invalid_priority_flag
      - dq_invalid_hour_flag
      - dq_invalid_dayofweek_flag
      - dq_cancelled_missing_person_flag
      - dq_unknown_person_type_flag
      - dq_negative_response_time_flag
      - dq_extreme_staying_time_flag
      - dq_parse_error_flag

    scope_flags:
      - qa_ready_flag

    timestamp_fields:
      - timestamp_utc
      - cancel_timestamp_utc

    time_field:
      - call_date
      - call_hour

    keyword_fields:
      - call_type
      - shift
      - ward_name
      - room_name
      - zone_name
      - area_name
      - person_location
      - person_type
      - person_name
      - call_name
      - cancel_person
      - cancellation_trigger
      - triggered_by
      - cancel_location
    
    boolean_fields:
      - is_cancelled
      - dq_unknown_location_flag
      - dq_missing_staying_time_when_cancelled
      - dq_missing_response_time
      - dq_extreme_response_time_flag
      - dq_invalid_priority_flag
      - dq_invalid_hour_flag
      - dq_invalid_dayofweek_flag
      - dq_cancelled_missing_person_flag
      - dq_unknown_person_type_flag
      - dq_negative_response_time_flag
      - dq_extreme_staying_time_flag
      - dq_parse_error_flag
      - qa_ready_flag

    numeric_outlier_fields:
      - response_time_sec
      - staying_time_sec
      - staying_time_min

    display_value_maps:
      is_cancelled:
        "1": "cancelled calls"
        "true": "cancelled calls"
        "yes": "cancelled calls"
        "0": "non-cancelled calls"
        "false": "non-cancelled calls"
        "no": "non-cancelled calls"

    default_source_fields:
      - call_id
      - call_date
      - timestamp_utc
      - cancel_timestamp_utc
      - ward_name
      - room_name
      - call_type
      - shift
      - priority
      - response_time_sec
      - staying_time_sec
      - is_cancelled
      - cancel_location
      
    date_format: dd/mm/yyyy
    timezone: UTC

    narration: {}

