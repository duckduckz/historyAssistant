fast_path:
    metric_inference:
        - metric: response_over_5_min_count
          mode: replace
          all:
              - respond
          any:
              - more than 5 minutes
              - over 5 minutes
              - longer than 5 minutes
              - above 5 minutes

        - metric: total_calls
          mode: add_if_missing
          any:
              - most calls
              - fewest calls
              - total calls
              - total historyCalls
              - how many calls
              - number of calls
              - count of calls
              - total_calls
              - calls by
              - calls per
              - calls received
              - received calls
              - historyCalls by
              - historyCalls per

    group_by_inference:
        - dimension: call_dayofweek
          mode: add_if_missing
          any:
              - day of the week
              - days of the week
              - weekday
              - weekdays
              - each day

        - dimension: call_hour
          mode: add_if_missing
          any:
              - each hour
              - by hour
              - per hour
              - every hour
              - at each hour
              - call_hour

    group_by_from_time_entities:
        - call_hour
        - call_dayofweek
        - call_month

    date_rule_overrides:
        - from: last_7_days
          to: rolling_days
          date_params:
              days: 7

        - metric: total_calls
          from: rolling_days
          to: last_calendar_week
          any:
              - last week
          none:
              - last 7 days
              - past week
              - recent week
              - most recent 7 days
    
