disallowed_dimensions:
  - ward_id
  - person_name
  - person_location
  - cancel_location
  - call_id
  - qa_ready_flag
  - timestamp_utc
  - cancel_timestamp_utc
  - call_name
  - cancel_person
  - cancellation_trigger
  - triggered_by

selection_rules:
  prefer_line_when_x_role:
    - time

  prefer_bar_when_x_role:
    - categorical
    - ordered_category

  prefer_horizontal_bar_for_ranking: true
  prefer_stacked_bar_when_series_present: true

validation_hints:
  pie_requires_single_group_by: true
  pie_max_categories: 6
  scatter_prefers_two_numeric_axes: false
  scatter_disallow_categorical_x: false
  time_trend_default_dimension: call_date
  max_categories_without_warning: 20
  max_series_without_warning: 8
  disallow_multi_metric_same_chart: true
  privacy_note: Avoid person-level charts; use aggregate operational dimensions only.

titles:
  auto_title_templates:
    line: "{metric_label} over {x_label}"
    area: "{metric_label} over {x_label}"
    bar: "{metric_label} by {x_label}"
    horizontal_bar: "{metric_label} by {x_label}"
    stacked_bar: "{metric_label} by {x_label} split by {series_label}"

formatting:
  round_numeric_metrics:
    avg_response_time: 2
    avg_staying_time: 2
    median_response_time: 2
    median_staying_time: 2
    p75_response_time: 2
    p90_response_time: 2
    p90_staying_time: 2
    p95_staying_time: 2
    response_within_2_min_rate: 2
    response_within_3_min_rate: 2
    response_over_5_min_rate: 2

  default_sort:
    line: x_asc
    area: x_asc
    bar: metric_desc
    horizontal_bar: metric_desc
    stacked_bar: x_asc
