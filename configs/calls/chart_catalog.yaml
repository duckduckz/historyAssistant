schema_version: 2

policy:
  enabled: true
  active_table: historyCalls
  default_chart_type: line
  max_group_by_fields: 2

  allowed_chart_types:
    - line
    - bar
    - horizontal_bar
    - stacked_bar
    - area
    - pie
    - scatter
    - histogram
    - dot_plot

  output:
    save_dir: outputs/charts/
    image_format: png
    dpi: 150

chart_types:
  line:
    description: Best for time trends and ordered comparisons.
    requires:
      x_axis: dimension_or_time
      y_axis: metric
    supports_series: true
    preferred_x_roles:
      - time
      - ordered_category

  bar:
    description: Best for comparing values across categories.
    requires:
      x_axis: dimension_or_time
      y_axis: metric
    supports_series: true
    preferred_x_roles:
      - categorical
      - ordered_category
      - time

  horizontal_bar:
    description: Best for ranked comparisons such as top or bottom categories.
    requires:
      x_axis: metric
      y_axis: single_categorical_dimension
    supports_series: false
    preferred_x_roles:
      - categorical
      - ordered_category

  stacked_bar:
    description: Best for comparison with a second breakdown category.
    requires:
      x_axis: dimension_or_time
      y_axis: metric
    supports_series: true
    preferred_x_roles:
      - categorical
      - ordered_category
      - time

  area:
    description: Best for time trend magnitude and stacked trend views.
    requires:
      x_axis: dimension_or_time
      y_axis: metric
    supports_series: true
    preferred_x_roles:
      - time

  pie:
    description: Best for composition across a small number of categories.
    requires:
      x_axis: single_categorical_dimension
      y_axis: metric
    supports_series: false
    max_categories_recommended: 6

  scatter:
    description: Best for showing individual data points per category or over time. Works with date, ordered, or numeric x-axis.
    requires:
      x_axis: dimension_or_time
      y_axis: metric
    supports_series: true
    notes:
      - Use a categorical series only when low-cardinality.

  histogram:
    description: Best for showing distribution of a metric across ordered numeric or time-based bins such as call hour or day of week.
    requires:
      x_axis: ordered_numeric_or_time_dimension
      y_axis: metric
    supports_series: false
    preferred_x_roles:
      - ordered_category
      - time

  dot_plot:
    description: Best for comparing individual metric values per category with a clean minimal look. Good alternative to bar when there are many categories.
    requires:
      x_axis: dimension_or_time
      y_axis: metric
    supports_series: false
    preferred_x_roles:
      - categorical
      - ordered_category

