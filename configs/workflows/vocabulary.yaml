metrics:
  presence_event_count:
    synonyms:
      - presence events
      - staff presence count
      - nurse presence count
    description: Number of times staff were recorded as present in a room or ward — measures how much staff attention each location received.
    aliases_for_embedding:
      - how often staff visited the room
      - how many times nurses were in the room
      - staff visit count
      - which rooms received the most staff attention
      - how much attention did each room get from nurses
      - staff presence per room or ward
      - rooms with the most nurse visits

  presence_details:
    synonyms:
      - presence details
      - presence records
    description: The raw individual presence events — shows which staff member was present, in which room, and when.
    aliases_for_embedding:
      - show me who was in each room
      - list the individual presence events for staff
      - which nurses were present and when

  presence_room_switch_within_minutes:
    synonyms:
      - room switch within 5 minutes
      - rapid room switch
    description: Cases where the same staff member was recorded as present in two different rooms within a short time window, which may indicate a data quality issue.
    aliases_for_embedding:
      - nurse appearing in two rooms too quickly
      - staff present in different rooms within minutes
      - impossible presence — same person in multiple rooms

