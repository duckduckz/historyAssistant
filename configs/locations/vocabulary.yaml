      superseded_by_filter: personType

  group_by_inference:
    - dimension: personFirstName
      mode: add_if_missing
      any:
        - patient
        - patients
        - person
        - people
        - resident
        - residents
        - who moved
        - who exercised
        - who was active
        - most active patients

    - dimension: ward
      mode: add_if_missing
      any:
        - ward
        - wards
        - department
        - departments
        - unit
        - units

    - dimension: area
      mode: add_if_missing
      any:
        - area
        - areas
        - place
        - places

    - dimension: zoneName
      mode: add_if_missing
      any:
        - zone
        - zones

    - dimension: movement_status
      mode: add_if_missing
      any:
        - movement status
        - status
