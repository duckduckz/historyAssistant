schema_version: 2

policy:
  enabled: true
  active_table: historyWorkflows
  default_chart_type: bar
  max_group_by_fields: 2
  allowed_chart_types:
    - line
    - bar
    - horizontal_bar
    - stacked_bar
    - scatter
    - dot_plot

chart_types:
  line:
    description: Best for presence trends over dates or hours.
    supports_series: true
  bar:
    description: Best for comparing presence counts across shifts, rooms, wards, or staff.
    supports_series: true
  horizontal_bar:
    description: Best for ranked room, ward, or staff presence comparisons.
    supports_series: false
  stacked_bar:
    description: Best for category comparisons split by another category, such as ward by shift.
    supports_series: true
  scatter:
    description: Best for showing individual points when categories are crowded.
    supports_series: true
  dot_plot:
    description: Best for compact comparison across many categories.
    supports_series: false

dimensions:
  workflow_date:
    label: Workflow date
    role: time
    semantic_type: temporal
    allowed_chart_types: [line, bar, stacked_bar, scatter]
    allowed_axis_slots: [x]

  timestamp_utc:
    label: Timestamp
    role: time
    semantic_type: temporal
    allowed_chart_types: [line, scatter]
    allowed_axis_slots: [x]

  shift:
    label: Shift
    role: ordered_category
    semantic_type: ordinal
    domain_order: [morning, afternoon, night, unknown]
    allowed_chart_types: [line, bar, horizontal_bar, stacked_bar, dot_plot]
    allowed_axis_slots: [x, y, series]

  workflow_name:
    label: Workflow name
    role: categorical
    semantic_type: nominal
    allowed_chart_types: [bar, horizontal_bar, stacked_bar, dot_plot]
    allowed_axis_slots: [x, y, series]

  workflow_type:
    label: Workflow type
    role: categorical
    semantic_type: nominal
    allowed_chart_types: [bar, horizontal_bar, stacked_bar, dot_plot]
    allowed_axis_slots: [x, y, series]

  ward_name:
    label: Ward
    role: categorical
    semantic_type: nominal
    allowed_chart_types: [bar, horizontal_bar, stacked_bar, dot_plot]
    allowed_axis_slots: [x, y, series]

  room_name:
    label: Room
    role: categorical
    semantic_type: nominal
    allowed_chart_types: [bar, horizontal_bar, stacked_bar, dot_plot]
    allowed_axis_slots: [x, y, series]

  initiator_person:
    label: Initiator
    role: categorical
    semantic_type: nominal
    allowed_chart_types: [bar, horizontal_bar, dot_plot]
    allowed_axis_slots: [x, y]

  workflow_dayofweek:
    label: Day of week
    role: ordered_category
    semantic_type: ordinal
    domain_order: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    allowed_chart_types: [line, bar, horizontal_bar, stacked_bar, dot_plot]
    allowed_axis_slots: [x, y, series]

  workflow_hour:
    label: Hour
    role: ordered_category
    semantic_type: ordinal
    allowed_chart_types: [line, bar, stacked_bar, scatter]
    allowed_axis_slots: [x, series]

metrics:
  presence_event_count:
    label: Presence events
    unit: presence_events
    allowed_chart_types: [line, bar, horizontal_bar, stacked_bar, scatter, dot_plot]
    recommended_dimensions: [workflow_date, shift, ward_name, room_name, initiator_person]
    allowed_series: [shift, ward_name, room_name, workflow_dayofweek]

disallowed_dimensions:
  - workflow_id

selection_rules:
  prefer_line_when_x_role: [time]
  prefer_bar_when_x_role: [categorical, ordered_category]
  prefer_horizontal_bar_for_ranking: true
  prefer_stacked_bar_when_series_present: true

validation_hints:
  pie_requires_single_group_by: true
  pie_max_categories: 6
  scatter_prefers_two_numeric_axes: false
  scatter_disallow_categorical_x: false
  time_trend_default_dimension: workflow_date
  max_categories_without_warning: 20
  max_series_without_warning: 8
  disallow_multi_metric_same_chart: true
  privacy_note: Initiator labels may be encoded; charts shorten display labels but keep source rows unchanged.

titles:
  auto_title_templates:
    line: "{metric_label} over {x_label}"
    bar: "{metric_label} by {x_label}"
    horizontal_bar: "{metric_label} by {x_label}"
    stacked_bar: "{metric_label} by {x_label} split by {series_label}"

formatting:
  default_sort:
    line: x_asc
    bar: metric_desc
    horizontal_bar: metric_desc
    stacked_bar: x_asc
